[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdm"
version = "1.0.0"
description = "Predictive maintenance for industrial machines: failure prediction and anomaly detection on sensor data"
requires-python = ">=3.11"
authors = [{ name = "Ahmed Benmohamed" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
